name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: .venv/
          key: ${{ runner.os }}-${{ matrix.python }}-uv-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Static type checking
        run: make type
      - name: Lint
        run: make lint
      - name: Formatting
        run: make format-check
      - name: Unit tests
        run: make test
      - name: Django Static Checks
        run: make check
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}
      - name: Install Playwright browser and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      - name: Browser tests
        run: make e2e
      - name: Upload the Cucumber report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            e2e/report/index.html
            e2e/report/cucumber.json
            e2e/test-results/
          retention-days: 14
