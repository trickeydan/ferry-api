name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: .venv/
          key: ${{ runner.os }}-${{ matrix.python }}-uv-${{ hashFiles('uv.lock') }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Static type checking
        run: make type
      - name: Lint
        run: make lint
      - name: Formatting
        run: make format-check
      - name: Unit tests
        run: make test
      - name: Django Static Checks
        run: make check